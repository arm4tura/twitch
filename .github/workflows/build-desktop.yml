name: Build desktop (Windows + macOS)

# Собирает десктоп-сборки Twitch Cut под Windows и macOS и публикует их в один
# и тот же GitHub Release.
#
# Триггеры:
#   - push тега вида v* (напр. vX.Y.Z) — собирает и публикует релиз;
#   - ручной запуск (workflow_dispatch) — собирает артефакты БЕЗ публикации,
#     удобно проверить сборку, не создавая релиз.
#
# Бэкенд (Python) собирается PyInstaller'ом в самостоятельный каталог и едет
# внутри установщика (backend/packaging/twitch-cut-backend.spec): ни Python,
# ни torch пользователю ставить не нужно, при первом запуске докачиваются
# только ONNX-модели. PyInstaller не умеет кросс-сборку, поэтому бэкенд под
# каждую архитектуру собирается на раннере этой архитектуры:
#   - Windows x64 — windows-latest;
#   - macOS arm64 — macos-latest, macOS x64 — macos-15-intel.
# Мак-бэкенды собираются отдельными джобами и сходятся в одну джобу
# electron-builder (--arm64 --x64 за один вызов): так latest-mac.yml для
# автообновления содержит обе архитектуры, а не ту, что залилась последней.
#
# Публикация идёт через electron-builder --publish, который читает секцию
# build.publish (github / arm4tura / twitch) из desktop/package.json и заливает
# артефакты в релиз, соответствующий тегу. Токен — штатный GITHUB_TOKEN,
# отдельных секретов не надо.
#   - Windows: `Twitch Cut Setup <version>.exe` + latest.yml
#   - macOS:   `Twitch Cut-<version>-{arm64,x64}.dmg` + *.zip + latest-mac.yml
#     (.zip нужен электрон-апдейтеру для автообновления на macOS).
#
# ВНИМАНИЕ (macOS): сборка НЕ подписана и НЕ нотаризована (build.mac.notarize
# = false, сертификатов в secrets нет). DMG соберётся и запустится, но у
# пользователя будет предупреждение Gatekeeper — первый запуск через
# ПКМ → «Открыть». Для «чистого» распространения нужен Apple Developer ID
# (CSC_LINK / CSC_KEY_PASSWORD + APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/TEAM_ID
# в secrets и notarize: true). Пока — неподписанный билд.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write # нужно, чтобы electron-builder мог создать/обновить Release

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-win.txt

      # Окружение бэкенда: onnxruntime-directml, без torch.
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-win.txt
          pip install -e . --no-deps
          pip install "pyinstaller>=6.10,<7" "pytest==9.1.1" "httpx==0.28.1"

      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Build backend (PyInstaller)
        working-directory: backend
        run: pyinstaller --noconfirm --clean --distpath dist/x64 packaging/twitch-cut-backend.spec

      # Как первый запуск у пользователя: собранный бэкенд сам качает модели
      # из релиза (HTTPS, sha256) и поднимает ускоритель. Ловит забытые в
      # сборке данные (сертификаты, словари) до того, как их найдёт пользователь.
      - name: Smoke-test backend
        working-directory: backend
        env:
          TWITCH_CUT_DATA_DIR: ${{ runner.temp }}/twitch-cut-data
        run: |
          dist/x64/twitch-cut-backend/twitch-cut-backend.exe --help
          dist/x64/twitch-cut-backend/twitch-cut-backend.exe prefetch
          dist/x64/twitch-cut-backend/twitch-cut-backend.exe accel

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      # Кладём бинарник TwitchDownloaderCLI в build/tdcli/win-x64 ДО electron-builder.
      # В репо бинарника нет (только .gitkeep), а workflow зовёт `npm run build`, а не
      # `npm run dist`, поэтому хук predist сам не сработает — качаем явным шагом,
      # иначе в установщик Windows downloader не попадёт (backend докачал бы на
      # первом запуске, но лучше сразу «из коробки»).
      - name: Prepare TwitchDownloaderCLI (win-x64)
        working-directory: desktop
        run: npm run prepare-tdcli
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Тег push → публикуем в Releases (--publish always).
      # Ручной запуск → только собираем, не публикуем (--publish never).
      - name: Build & publish installer (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        run: npm run build && npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer only (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: desktop
        run: npm run build && npx electron-builder --win --x64 --publish never

      # Всегда прикладываем установщик как artifact — можно скачать со страницы
      # запуска даже при ручном прогоне без релиза.
      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: twitch-cut-windows-installer
          path: |
            desktop/release/*.exe
            desktop/release/latest.yml
          if-no-files-found: error

  backend-macos:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-mac.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-mac.txt
          pip install -e . --no-deps
          pip install "pyinstaller>=6.10,<7" "pytest==9.1.1" "httpx==0.28.1"

      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Build backend (PyInstaller)
        working-directory: backend
        run: pyinstaller --noconfirm --clean --distpath dist/${{ matrix.arch }} packaging/twitch-cut-backend.spec

      - name: Smoke-test backend
        working-directory: backend
        env:
          TWITCH_CUT_DATA_DIR: ${{ runner.temp }}/twitch-cut-data
        run: |
          dist/${{ matrix.arch }}/twitch-cut-backend/twitch-cut-backend --help
          dist/${{ matrix.arch }}/twitch-cut-backend/twitch-cut-backend prefetch
          dist/${{ matrix.arch }}/twitch-cut-backend/twitch-cut-backend accel

      # tar, а не каталог: upload-artifact теряет права на исполнение.
      - name: Pack backend
        working-directory: backend
        run: tar czf backend-macos-${{ matrix.arch }}.tgz -C dist/${{ matrix.arch }} twitch-cut-backend

      - name: Upload backend
        uses: actions/upload-artifact@v6
        with:
          name: backend-macos-${{ matrix.arch }}
          path: backend/backend-macos-${{ matrix.arch }}.tgz
          if-no-files-found: error

  build-macos:
    needs: backend-macos
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download backends
        uses: actions/download-artifact@v6
        with:
          pattern: backend-macos-*
          path: backend-artifacts
          merge-multiple: true

      - name: Unpack backends
        working-directory: .
        run: |
          for arch in arm64 x64; do
            mkdir -p backend/dist/$arch
            tar xzf backend-artifacts/backend-macos-$arch.tgz -C backend/dist/$arch
          done

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Кладём mac-бинарники TwitchDownloaderCLI (обе арки) в build/tdcli/osx-* ДО
      # electron-builder — по той же причине, что и в windows-джобе (predist не
      # срабатывает при `npm run build`). Дефолт prepare-tdcli на macOS качает
      # СРАЗУ osx-arm64 и osx-x64 (см. parseTargets в prepare-tdcli.js).
      - name: Prepare TwitchDownloaderCLI (macOS arm64 + x64)
        run: npm run prepare-tdcli
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # На теге собираем dmg+zip под обе арки (arm64 + x64) и публикуем в тот же
      # релиз. electron-builder дописывает файлы к уже существующему релизу тега,
      # так что windows- и macos-джобы мирно кладут артефакты рядом.
      - name: Build & publish dmg (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run build && npx electron-builder --mac --arm64 --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dmg only (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run build && npx electron-builder --mac --arm64 --x64 --publish never

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v6
        with:
          name: twitch-cut-macos-dmg
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/latest-mac.yml
          if-no-files-found: error
